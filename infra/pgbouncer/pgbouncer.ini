; RAVEL — PgBouncer configuration
; Two logical databases proxied through a single pooler.
; CLAUDE.md SLA: max 200 active Postgres connections cluster-wide.

[databases]
ravel_db1 = host=postgres port=5432 dbname=ravel_db1
ravel_db2 = host=postgres port=5432 dbname=ravel_db2

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; --- Auth (DEV) -------------------------------------------------------
; auth_type=plain reads cleartext userlist.txt (generated at runtime
; from POSTGRES_USER / POSTGRES_PASSWORD env in compose's entrypoint).
; PRODUCTION: switch to scram-sha-256 with a hashed userlist OR an
; auth_query against a SECURITY DEFINER lookup function.
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

; --- Pooling ---------------------------------------------------------
; transaction mode = each transaction gets a backend connection;
; required for high-concurrency Python services.
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 50
reserve_pool_size = 10
reserve_pool_timeout = 5

; psycopg / asyncpg send extra_float_digits at startup; harmless.
ignore_startup_parameters = extra_float_digits

; --- Admin ------------------------------------------------------------
; Keep this in sync with POSTGRES_USER in .env (default: ravel_admin).
admin_users = ravel_admin
stats_users = ravel_admin

; --- Logging (verbose flags off for dev quiet) -----------------------
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
