# RAVEL frontend — nginx prod config (Adım 8k).
#
# Üç sorumluluk:
#  1) SPA static serve: /assets/* + index.html fallback (try_files).
#  2) /api, /auth → api_gateway:8000 (HTTP REST)
#  3) /admin → rag:8003 (admin paneli)
#  4) /ws → api_gateway:8000 (WebSocket Upgrade)
#
# Container içi DNS adları (compose service network).

worker_processes  auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript application/xml application/octet-stream;
    gzip_min_length 256;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Long cache for hashed assets, no-cache for index.html
        location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|avif)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # API Gateway (REST)
        location ~ ^/(api|auth)/ {
            proxy_pass http://api_gateway:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # RAG Admin
        location /admin/ {
            proxy_pass http://rag:8003;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Excel/PDF/DOCX upload — büyük gövdeyi izin ver.
            client_max_body_size 50m;
            proxy_read_timeout 120s;
        }

        # MinIO video proxy — Manim worker presigned URL'leri
        # http://minio:9000/... şeklinde imzalanır (AWS SigV4: Host header
        # imzaya dahil). Tarayıcıdan minio:9000'e doğrudan erişim olmadığı
        # için backend URL'yi /minio-videos/... olarak rewrite eder; nginx
        # burada `Host: minio:9000` header'ını koruyarak MinIO'ya forward
        # eder, imza match eder.
        location /minio-videos/ {
            rewrite ^/minio-videos/(.*)$ /$1 break;
            proxy_pass http://minio:9000;
            proxy_http_version 1.1;
            proxy_set_header Host              minio:9000;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Video streaming — büyük dosyalar, range request
            proxy_buffering    off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            client_max_body_size 0;  # presigned PUT için sınırsız
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://api_gateway:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 1h;             # uzun ömürlü WS
        }

        # SPA fallback — hash router yerine BrowserRouter kullanıyoruz.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
